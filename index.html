<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121219" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace OS</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('mkos.theme')
        var d = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', d)
        document.documentElement.style.colorScheme = d ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
